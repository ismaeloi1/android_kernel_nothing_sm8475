name: Build lhuna Kernel

on:
  push:
    branches:
      - claude/kernelsu-symlink-setup-bV2Rs
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git ccache automake flex lzop bison gperf build-essential zip curl \
            zlib1g-dev libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev \
            squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng \
            maven libssl-dev pwgen libswitch-perl policycoreutils minicom \
            libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 libx11-dev \
            lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python3 \
            clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup SUSFS patches
        run: |
          git clone --depth=1 --branch gki-android12-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          echo "SUSFS cloned"

      - name: Setup KernelSU (clone + SUSFS patch + symlink)
        run: |
          KSU_TAG=$(git ls-remote --tags https://github.com/tiann/KernelSU \
            | grep -v '\^{}' | awk '{print $2}' | sed 's|refs/tags/||' \
            | grep '^v' | sort -V | tail -1)
          echo "KernelSU tag: $KSU_TAG"
          git clone --depth=1 --branch "$KSU_TAG" https://github.com/tiann/KernelSU ../KernelSU
          cd ../KernelSU

          # Apply SUSFS patch (some hunks may fail on version delta — that's OK)
          patch -p1 --fuzz=3 \
            < "$GITHUB_WORKSPACE/../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" \
            || echo "patch exited non-zero (partial apply) — applying critical fixes manually"

          # Critical fix 1: remove kprobes dependency from Kconfig (mandatory for non-GKI)
          sed -i 's/^\s*depends on KPROBES && EXT4_FS//' kernel/Kconfig

          # Critical fix 2: remove kprobe hook objects from Kbuild if still present
          sed -i '/lsm_hook\.o/d' kernel/Kbuild
          sed -i '/syscall_event_bridge\.o/d' kernel/Kbuild
          sed -i '/syscall_hook_manager\.o/d' kernel/Kbuild
          sed -i '/tp_marker\.o/d' kernel/Kbuild

          echo "Kconfig after fix:"
          grep -A2 "config KSU" kernel/Kconfig | head -6

          cd "$GITHUB_WORKSPACE"
          ln -sfn ../../KernelSU/kernel drivers/kernelsu
          echo "Symlink OK: $(readlink drivers/kernelsu)"

      - name: Apply SUSFS kernel patches
        run: |
          patch -p1 --reject-file=/tmp/susfs.rej \
            < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch \
            || echo "Some hunks rejected (already applied in repo) - continuing"
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          cp ../susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
          echo "SUSFS files installed"

      - name: Build kernel
        run: |
          mkdir -p out
          cp defconfig out/.config
          make O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          make O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            KBUILD_BUILD_USER=lhuna \
            KBUILD_BUILD_HOST=lhuna \
            KBUILD_BUILD_TIMESTAMP="Thu Jan  1 00:00:00 UTC 2026" \
            -j$(nproc) 2>&1 | tee build.log \
            || {
              echo "===== BUILD FAILED ====="
              echo "--- Error lines ---"
              grep -E " error:|undefined reference to|: error" build.log | tail -100
              echo "--- Last 80 lines ---"
              tail -80 build.log
              exit 1
            }

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/ || true
          cp .github/anykernel.sh AnyKernel3/anykernel.sh
          DATE=$(date +%Y%m%d)
          cd AnyKernel3
          zip -r9 "../lhuna-kernel-pong-${DATE}.zip" . -x ".git/*" "README.md" "*placeholder"
          cd ..
          ls -lh "lhuna-kernel-pong-${DATE}.zip"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: lhuna-kernel
          path: lhuna-kernel-pong-*.zip
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
