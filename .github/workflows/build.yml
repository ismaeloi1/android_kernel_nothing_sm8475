        with:
          fetch-depth: 1

      - name: Setup SUSFS
        run: |
          git clone --depth=1 --branch gki-android12-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu

      - name: Setup KernelSU — symlink (stable)
        run: |
          git clone --branch "$KSU_TAG" https://github.com/tiann/KernelSU ../KernelSU
          echo "KernelSU commit count: $(git -C ../KernelSU rev-list --count HEAD)"
          cd ../KernelSU

          patch -p1 --fuzz=3 \
            < "$GITHUB_WORKSPACE/../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" \
            || echo "patch partial — applying fixes manually"

          sed -i 's/^\s*depends on KPROBES && EXT4_FS//' kernel/Kconfig

          sed -i 's/#if (LINUX_VERSION_CODE >= KERNEL_VERSION(6, 4, 0))/#if 1 \/* QC 5.10 backports 6.4+ SELinux AVC API *\//g' \
            kernel/selinux/rules.c
          sed -i 's/#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 10, 0)/#if 1 \/* QC 5.10 backports 6.10+ hashtab const API *\//g' \
            kernel/selinux/sepolicy.c

          cd "$GITHUB_WORKSPACE"
          ln -sfn ../../KernelSU/kernel drivers/kernelsu
          echo "Symlink: $(readlink drivers/kernelsu)"

      - name: Apply SUSFS kernel patches
        run: |
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          cp ../susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h

      - name: Build kernel
        run: |
          mkdir -p out
          cp defconfig out/.config
          make O=out ARCH=arm64 \
            CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            olddefconfig

          make O=out ARCH=arm64 \
            CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            KCFLAGS="-march=armv8.2-a" \
            KBUILD_BUILD_USER=lhuna \
            KBUILD_BUILD_HOST=lhuna \
            KBUILD_BUILD_TIMESTAMP="Thu Jan  1 00:00:00 UTC 2026" \
            -j$(nproc) 2>&1 | tee build.log \
            || {
              echo "===== BUILD FAILED ====="
              grep -E " error:|undefined reference to|: error" build.log | tail -100
              echo "--- Last 80 lines ---"
              tail -80 build.log
              exit 1
