# ─────────────────────────────────────────────────────────────────────────────
# 3 · stable · llvm-minimal-git via paru (AUR dev, no docs/OCaml/LLDB)
# ─────────────────────────────────────────────────────────────────────────────
  build-stable-aur:
    name: "stable · paru llvm-minimal-git"
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - name: Init pacman, install paru, build llvm-minimal-git
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          # Base deps + rust (needed to build paru)
          pacman -S --noconfirm --needed \
            git rust \
            bc dtc elfutils flex bison openssl \
            zip wget curl python perl lzop lz4 pahole pigz
          git config --global --add safe.directory '*'

          # Create non-root builder user (makepkg refuses root)
          useradd -m -G wheel builder
          echo "builder ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

          # Bootstrap paru from AUR
          su builder -c "
            git clone https://aur.archlinux.org/paru.git /tmp/paru-src
            cd /tmp/paru-src
            MAKEFLAGS=\"-j$(nproc)\" makepkg -si --noconfirm
          "

          # Install llvm-minimal-git (clang+lld+llvm core only, no docs/OCaml/LLDB)
          su builder -c "
            MAKEFLAGS=\"-j$(nproc)\" NINJAFLAGS=\"-j$(nproc)\" \
            paru -S --noconfirm --skipreview --noprogressbar llvm-minimal-git
          "

          clang --version && ld.lld --version && llvm-ar --version | head -1

          ln -sf /usr/bin/clang        /usr/local/bin/aarch64-linux-gnu-gcc
          ln -sf /usr/bin/clang++      /usr/local/bin/aarch64-linux-gnu-g++
          ln -sf /usr/bin/ld.lld       /usr/local/bin/aarch64-linux-gnu-ld
          ln -sf /usr/bin/llvm-ar      /usr/local/bin/aarch64-linux-gnu-ar
          ln -sf /usr/bin/llvm-nm      /usr/local/bin/aarch64-linux-gnu-nm
          ln -sf /usr/bin/llvm-strip   /usr/local/bin/aarch64-linux-gnu-strip
          ln -sf /usr/bin/llvm-objcopy /usr/local/bin/aarch64-linux-gnu-objcopy
          ln -sf /usr/bin/llvm-objdump /usr/local/bin/aarch64-linux-gnu-objdump
          ln -sf /usr/bin/llvm-readelf /usr/local/bin/aarch64-linux-gnu-readelf

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup SUSFS
        run: |
          git clone --depth=1 --branch gki-android12-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu

      - name: Setup KernelSU — symlink (stable)
        run: |
          git clone --branch "$KSU_TAG" https://github.com/tiann/KernelSU ../KernelSU
          echo "KernelSU commit count: $(git -C ../KernelSU rev-list --count HEAD)"
          cd ../KernelSU
          patch -p1 --fuzz=3 \
            < "$GITHUB_WORKSPACE/../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" \
            || echo "patch partial — applying fixes manually"
          sed -i 's/^\s*depends on KPROBES && EXT4_FS//' kernel/Kconfig
          sed -i 's/#if (LINUX_VERSION_CODE >= KERNEL_VERSION(6, 4, 0))/#if 1 \/* QC 5.10 backports 6.4+ SELinux AVC API *\//g' \
            kernel/selinux/rules.c
          sed -i 's/#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 10, 0)/#if 1 \/* QC 5.10 backports 6.10+ hashtab const API *\//g' \
            kernel/selinux/sepolicy.c
          cd "$GITHUB_WORKSPACE"
          ln -sfn ../../KernelSU/kernel drivers/kernelsu
          echo "Symlink: $(readlink drivers/kernelsu)"

      - name: Apply SUSFS kernel patches
        run: |
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          cp ../susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h

