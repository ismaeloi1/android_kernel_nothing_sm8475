name: Build lhuna Kernel

on:
  push:
    branches:
      - claude/kernelsu-symlink-setup-bV2Rs
  workflow_dispatch:

env:
  KSU_TAG: "v3.2.4"

jobs:
# ─────────────────────────────────────────────────────────────────────────────
# 1 · stable · pacman clang (Arch rolling, stable recent)
# ─────────────────────────────────────────────────────────────────────────────
  build-stable-pacman:
    name: "stable · pacman clang"
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - name: Init pacman & install deps
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git clang lld llvm \
            bc dtc elfutils flex bison openssl \
            zip wget curl python perl lzop lz4 pahole
          # Verify toolchain
          clang --version && ld.lld --version && llvm-ar --version | head -1
          # LLVM wrappers for aarch64-linux-gnu- prefix used by kernel scripts
          for t in gcc g++ ld strip ar nm objcopy objdump readelf; do
            ln -sf /usr/bin/clang      /usr/local/bin/aarch64-linux-gnu-$t 2>/dev/null || true
          done
          ln -sf /usr/bin/ld.lld       /usr/local/bin/aarch64-linux-gnu-ld
          ln -sf /usr/bin/llvm-ar      /usr/local/bin/aarch64-linux-gnu-ar
          ln -sf /usr/bin/llvm-nm      /usr/local/bin/aarch64-linux-gnu-nm
          ln -sf /usr/bin/llvm-strip   /usr/local/bin/aarch64-linux-gnu-strip
          ln -sf /usr/bin/llvm-objcopy /usr/local/bin/aarch64-linux-gnu-objcopy
          ln -sf /usr/bin/llvm-objdump /usr/local/bin/aarch64-linux-gnu-objdump
          ln -sf /usr/bin/llvm-readelf /usr/local/bin/aarch64-linux-gnu-readelf

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup SUSFS
        run: |
          git clone --depth=1 --branch gki-android12-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu

      - name: Setup KernelSU — symlink (stable)
        run: |
          git clone --branch "$KSU_TAG" https://github.com/tiann/KernelSU ../KernelSU
          echo "KernelSU commit count: $(git -C ../KernelSU rev-list --count HEAD)"
          cd ../KernelSU

          patch -p1 --fuzz=3 \
            < "$GITHUB_WORKSPACE/../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" \
            || echo "patch partial — applying fixes manually"

          sed -i 's/^\s*depends on KPROBES && EXT4_FS//' kernel/Kconfig

          # SELinux API compat: QC 5.10 backports 6.4+ AVC API
          sed -i 's/#if (LINUX_VERSION_CODE >= KERNEL_VERSION(6, 4, 0))/#if 1 \/* QC 5.10 backports 6.4+ SELinux AVC API *\//g' \
            kernel/selinux/rules.c
          # SELinux compat: QC 5.10 backports 6.10+ hashtab const-callback API
          sed -i 's/#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 10, 0)/#if 1 \/* QC 5.10 backports 6.10+ hashtab const API *\//g' \
            kernel/selinux/sepolicy.c

          cd "$GITHUB_WORKSPACE"
          ln -sfn ../../KernelSU/kernel drivers/kernelsu
          echo "Symlink: $(readlink drivers/kernelsu)"

      - name: Apply SUSFS kernel patches
        run: |
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          cp ../susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h

      - name: Build kernel
        run: |
          mkdir -p out
          cp defconfig out/.config
          make O=out ARCH=arm64 \
            CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            olddefconfig

          make O=out ARCH=arm64 \
            CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            KCFLAGS="-march=armv8.2-a" \
            KBUILD_BUILD_USER=lhuna \
            KBUILD_BUILD_HOST=lhuna \
            KBUILD_BUILD_TIMESTAMP="Thu Jan  1 00:00:00 UTC 2026" \
            -j$(nproc) 2>&1 | tee build.log \
            || {
              echo "===== BUILD FAILED ====="
              grep -E " error:|undefined reference to|: error" build.log | tail -100
              echo "--- Last 80 lines ---"
              tail -80 build.log
              exit 1
            }

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/ || true
          cp .github/anykernel.sh AnyKernel3/anykernel.sh
          DATE=$(date +%Y%m%d)
          cd AnyKernel3
          zip -r9 "../lhuna-kernel-pong-${DATE}-stable-pacman.zip" . \
            -x ".git/*" "README.md" "*placeholder"
          cd ..
          ls -lh "lhuna-kernel-pong-${DATE}-stable-pacman.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lhuna-kernel-stable-pacman
          path: lhuna-kernel-pong-*-stable-pacman.zip
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-stable-pacman
          path: build.log


