name: Build lhuna Kernel

on:
  push:
    branches:
      - claude/kernelsu-symlink-setup-bV2Rs
  workflow_dispatch:

env:
  KSU_TAG: "v3.2.4"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: pacman-symlink
            label: "pacman · symlink"
            toolchain: pacman
            ksu: symlink
            image: archlinux:base-devel

          - variant: pacman-submodule
            label: "pacman · submodule"
            toolchain: pacman
            ksu: submodule
            image: archlinux:base-devel

          - variant: ubuntu-symlink
            label: "ubuntu · symlink"
            toolchain: ubuntu
            ksu: symlink
            image: ubuntu:24.04

          - variant: ubuntu-submodule
            label: "ubuntu · submodule"
            toolchain: ubuntu
            ksu: submodule
            image: ubuntu:24.04

    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --privileged

    steps:
      - name: Setup toolchain
        run: |
          if [ "${{ matrix.toolchain }}" = "pacman" ]; then
            pacman-key --init
            pacman-key --populate archlinux
            pacman -Syu --noconfirm
            pacman -S --noconfirm --needed \
              git bc dtc elfutils flex bison openssl \
              zip wget curl python perl lzop lz4 pahole pigz \
              clang lld llvm
          else
            DEBIAN_FRONTEND=noninteractive apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              git bc device-tree-compiler libelf-dev flex bison libssl-dev \
              zip wget curl python3 perl lzop lz4 dwarves pigz \
              clang lld llvm binutils make
            # Ubuntu ships versioned LLVM binaries (e.g. clang-18, llvm-ar-18).
            # update-alternatives usually wires up unversioned names, but verify
            # and create /usr/local/bin symlinks for any that are missing.
            for t in clang clang++ lld llvm-ar llvm-nm llvm-strip \
                     llvm-objcopy llvm-objdump llvm-readelf llvm-ranlib; do
              command -v "$t" >/dev/null 2>&1 && continue
              alt=$(ls /usr/bin/${t}-[0-9]* /usr/lib/llvm-*/bin/"$t" 2>/dev/null \
                    | sort -Vr | head -1 || true)
              [ -n "$alt" ] && ln -sf "$alt" "/usr/local/bin/$t" \
                || echo "WARN: $t not found after apt install"
            done
            # ld.lld lives outside the normal alternatives chain on some Ubuntu releases
            command -v ld.lld >/dev/null 2>&1 || {
              alt=$(ls /usr/bin/ld.lld-[0-9]* /usr/lib/llvm-*/bin/ld.lld 2>/dev/null \
                    | sort -Vr | head -1 || true)
              [ -n "$alt" ] && ln -sf "$alt" /usr/local/bin/ld.lld \
                || echo "WARN: ld.lld not found"
            }
          fi

          git config --global --add safe.directory '*'
          clang --version && ld.lld --version

          # Cross-compiler wrappers — kernel Makefile resolves CROSS_COMPILE=aarch64-linux-gnu-
          # to these names; point them all at the LLVM equivalents already in PATH.
          for t in gcc g++; do
            ln -sf "$(which clang)"        "/usr/local/bin/aarch64-linux-gnu-$t"
          done
          ln -sf "$(which ld.lld)"         /usr/local/bin/aarch64-linux-gnu-ld
          ln -sf "$(which llvm-ar)"        /usr/local/bin/aarch64-linux-gnu-ar
          ln -sf "$(which llvm-nm)"        /usr/local/bin/aarch64-linux-gnu-nm
          ln -sf "$(which llvm-strip)"     /usr/local/bin/aarch64-linux-gnu-strip
          ln -sf "$(which llvm-objcopy)"   /usr/local/bin/aarch64-linux-gnu-objcopy
          ln -sf "$(which llvm-objdump)"   /usr/local/bin/aarch64-linux-gnu-objdump
          ln -sf "$(which llvm-readelf)"   /usr/local/bin/aarch64-linux-gnu-readelf

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone SUSFS
        run: |
          git clone --depth=1 --branch gki-android12-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu

      - name: Setup KernelSU
        run: |
          if [ "${{ matrix.ksu }}" = "submodule" ]; then
            git submodule update --init KernelSU
            [ -f KernelSU/.git/shallow ] && git -C KernelSU fetch --unshallow || true
            echo "KernelSU commits: $(git -C KernelSU rev-list --count HEAD)"
            KSU_DIR="KernelSU"
            SYMLINK_TARGET="../KernelSU/kernel"
          else
            git clone --branch "$KSU_TAG" https://github.com/tiann/KernelSU ../KernelSU
            echo "KernelSU commits: $(git -C ../KernelSU rev-list --count HEAD)"
            KSU_DIR="../KernelSU"
            SYMLINK_TARGET="../../KernelSU/kernel"
          fi

          cd "$KSU_DIR"
          patch -p1 --fuzz=3 \
            < "$GITHUB_WORKSPACE/../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" \
            || true
          sed -i 's/^\s*depends on KPROBES && EXT4_FS//' kernel/Kconfig
          sed -i 's/#if (LINUX_VERSION_CODE >= KERNEL_VERSION(6, 4, 0))/#if 1/g' \
            kernel/selinux/rules.c
          sed -i 's/#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 10, 0)/#if 1/g' \
            kernel/selinux/sepolicy.c

          cd "$GITHUB_WORKSPACE"
          ln -sfn "$SYMLINK_TARGET" drivers/kernelsu
          echo "drivers/kernelsu -> $(readlink drivers/kernelsu)"

      - name: Apply SUSFS patches
        run: |
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          cp ../susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h

      - name: Build kernel
        run: |
          set -o pipefail
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          which clang && clang --version || { echo "ERROR: clang not in PATH"; exit 1; }
          mkdir -p out
          cp defconfig out/.config
          make O=out ARCH=arm64 \
            CC=clang LD=ld.lld \
            HOSTCC=clang HOSTCXX=clang++ \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            olddefconfig

          make O=out ARCH=arm64 \
            CC=clang LD=ld.lld \
            HOSTCC=clang HOSTCXX=clang++ \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            KCFLAGS="-march=armv8.2-a" \
            KBUILD_BUILD_USER=lhuna \
            KBUILD_BUILD_HOST=lhuna \
            -j$(nproc) 2>&1 | tee build.log

          [ -f out/arch/arm64/boot/Image ] || {
            echo "===== BUILD FAILED — no Image produced ====="
            grep -E " error:|undefined reference to" build.log | tail -50
            tail -40 build.log
            exit 1
          }

      - name: Package kernel
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/ || true
          cp .github/anykernel.sh AnyKernel3/anykernel.sh
          DATE=$(date +%Y%m%d)
          ZIPNAME="lhuna-pong-${DATE}-${{ matrix.variant }}.zip"
          cd AnyKernel3
          zip -r9 "../${ZIPNAME}" . -x ".git/*" "README.md" "*placeholder"
          cd ..
          ls -lh "${ZIPNAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lhuna-pong-${{ matrix.variant }}
          path: "lhuna-pong-*-${{ matrix.variant }}.zip"
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.variant }}
          path: build.log
