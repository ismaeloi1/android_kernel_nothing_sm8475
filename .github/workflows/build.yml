# ─────────────────────────────────────────────────────────────────────────────
# 3 · stable · llvm-git (AUR dev, cached weekly)
# ─────────────────────────────────────────────────────────────────────────────
  build-stable-aur:
    name: "stable · llvm-git AUR"
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - name: Init pacman keyring & install base deps
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git sudo cmake ninja python \
            bc dtc libelf flex bison openssl \
            zip wget curl perl lzop lz4 \
            pahole

      - name: Get current week for cache key
        id: date
        run: echo "week=$(date +%Y-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore llvm-git package cache
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: /tmp/llvm-git-pkg
          key: arch-llvm-git-${{ steps.date.outputs.week }}
          restore-keys: arch-llvm-git-

      - name: Build llvm-git from AUR (if no cache)
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          # makepkg refuses to run as root — create a builder user
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers
          mkdir -p /tmp/llvm-git-pkg

          su builder -c "
            git clone https://aur.archlinux.org/llvm-git.git /tmp/llvm-git-src
            cd /tmp/llvm-git-src
            # Restrict build targets to what we need (much faster)
            sed -i 's/-DLLVM_TARGETS_TO_BUILD=.*/\"-DLLVM_TARGETS_TO_BUILD=AArch64;X86\" \\\\/' PKGBUILD || true
            MAKEFLAGS='-j$(nproc)' makepkg -s --noconfirm --skippgpcheck
            cp *.pkg.tar.zst /tmp/llvm-git-pkg/
          "

      - name: Install llvm-git
        run: |
          pacman -U --noconfirm /tmp/llvm-git-pkg/llvm-git*.pkg.tar.zst \
            /tmp/llvm-git-pkg/clang-git*.pkg.tar.zst \
            /tmp/llvm-git-pkg/lld-git*.pkg.tar.zst 2>/dev/null \
            || pacman -U --noconfirm /tmp/llvm-git-pkg/*.pkg.tar.zst
          clang --version

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup SUSFS
        run: |
          git clone --depth=1 --branch gki-android12-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu

      - name: Setup KernelSU — symlink (stable)
        run: |
          git clone --branch "$KSU_TAG" https://github.com/tiann/KernelSU ../KernelSU
          echo "KernelSU commit count: $(git -C ../KernelSU rev-list --count HEAD)"
          cd ../KernelSU

          patch -p1 --fuzz=3 \
            < "$GITHUB_WORKSPACE/../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" \
            || echo "patch partial — applying fixes manually"

          sed -i 's/^\s*depends on KPROBES && EXT4_FS//' kernel/Kconfig

          sed -i 's/#if (LINUX_VERSION_CODE >= KERNEL_VERSION(6, 4, 0))/#if 1 \/* QC 5.10 backports 6.4+ SELinux AVC API *\//g' \
            kernel/selinux/rules.c

          sed -i 's/#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 10, 0)/#if 1 \/* QC 5.10 backports 6.10+ hashtab const API *\//g' \
            kernel/selinux/sepolicy.c

          cd "$GITHUB_WORKSPACE"
          ln -sfn ../../KernelSU/kernel drivers/kernelsu
          echo "Symlink: $(readlink drivers/kernelsu)"

      - name: Apply SUSFS kernel patches
        run: |
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          cp ../susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h

      - name: Build kernel
        run: |
          mkdir -p out
          cp defconfig out/.config
          make O=out ARCH=arm64 \
            CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            olddefconfig

          make O=out ARCH=arm64 \
            CC="clang -march=armv8.2-a" \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            KBUILD_BUILD_USER=lhuna \
            KBUILD_BUILD_HOST=lhuna \
            KBUILD_BUILD_TIMESTAMP="Thu Jan  1 00:00:00 UTC 2026" \
            -j$(nproc) 2>&1 | tee build.log \
            || {
              echo "===== BUILD FAILED ====="
              grep -E " error:|undefined reference to|: error" build.log | tail -100
              tail -80 build.log
              exit 1
            }

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/ || true
          cp .github/anykernel.sh AnyKernel3/anykernel.sh
          DATE=$(date +%Y%m%d)
          cd AnyKernel3
          zip -r9 "../lhuna-kernel-pong-${DATE}-stable-aur.zip" . \
            -x ".git/*" "README.md" "*placeholder"
          cd ..
          ls -lh "lhuna-kernel-pong-${DATE}-stable-aur.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lhuna-kernel-stable-aur
          path: lhuna-kernel-pong-*-stable-aur.zip
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-stable-aur
          path: build.log


