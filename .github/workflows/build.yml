name: Build lhuna Kernel

on:
  push:
    branches:
      - claude/kernelsu-symlink-setup-bV2Rs
  workflow_dispatch:

env:
  KSU_TAG: "v3.2.4"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: clang18-symlink
            label: "clang-18 · symlink"
            clang: "18"
            ksu: symlink
          - variant: clang18-submodule
            label: "clang-18 · submodule"
            clang: "18"
            ksu: submodule
          - variant: clang21-symlink
            label: "clang-21 · symlink"
            clang: "21"
            ksu: symlink
          - variant: clang21-submodule
            label: "clang-21 · submodule"
            clang: "21"
            ksu: submodule

    name: ${{ matrix.label }}
    runs-on: ubuntu-latest

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc bison flex libelf-dev libssl-dev \
            device-tree-compiler \
            build-essential zip python3 perl \
            lzop lz4 dwarves pigz

          if [ "${{ matrix.clang }}" = "21" ]; then
            wget -qO llvm.sh https://apt.llvm.org/llvm.sh
            sudo bash llvm.sh 21
            sudo apt-get install -y clang-21 lld-21 llvm-21
            for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-strip llvm-objcopy llvm-objdump llvm-readelf; do
              b="${t%-*}-21" 2>/dev/null || true
              case "$t" in
                clang)        sudo update-alternatives --install /usr/bin/clang        clang        /usr/bin/clang-21        100 ;;
                clang++)      sudo update-alternatives --install /usr/bin/clang++      clang++      /usr/bin/clang++-21      100 ;;
                ld.lld)       sudo update-alternatives --install /usr/bin/ld.lld       ld.lld       /usr/bin/ld.lld-21       100 ;;
                llvm-ar)      sudo update-alternatives --install /usr/bin/llvm-ar      llvm-ar      /usr/bin/llvm-ar-21      100 ;;
                llvm-nm)      sudo update-alternatives --install /usr/bin/llvm-nm      llvm-nm      /usr/bin/llvm-nm-21      100 ;;
                llvm-strip)   sudo update-alternatives --install /usr/bin/llvm-strip   llvm-strip   /usr/bin/llvm-strip-21   100 ;;
                llvm-objcopy) sudo update-alternatives --install /usr/bin/llvm-objcopy llvm-objcopy /usr/bin/llvm-objcopy-21 100 ;;
                llvm-objdump) sudo update-alternatives --install /usr/bin/llvm-objdump llvm-objdump /usr/bin/llvm-objdump-21 100 ;;
                llvm-readelf) sudo update-alternatives --install /usr/bin/llvm-readelf llvm-readelf /usr/bin/llvm-readelf-21 100 ;;
              esac
            done
          else
            sudo apt-get install -y clang lld llvm
          fi

          clang --version
          ld.lld --version

          # Wrappers so the kernel build system finds aarch64-linux-gnu-* via clang
          for tool in gcc g++; do
            sudo ln -sf "$(which clang)" /usr/local/bin/aarch64-linux-gnu-${tool}
          done
          sudo ln -sf "$(which ld.lld)"       /usr/local/bin/aarch64-linux-gnu-ld
          sudo ln -sf "$(which llvm-ar)"      /usr/local/bin/aarch64-linux-gnu-ar
          sudo ln -sf "$(which llvm-nm)"      /usr/local/bin/aarch64-linux-gnu-nm
          sudo ln -sf "$(which llvm-strip)"   /usr/local/bin/aarch64-linux-gnu-strip
          sudo ln -sf "$(which llvm-objcopy)" /usr/local/bin/aarch64-linux-gnu-objcopy
          sudo ln -sf "$(which llvm-objdump)" /usr/local/bin/aarch64-linux-gnu-objdump
          sudo ln -sf "$(which llvm-readelf)" /usr/local/bin/aarch64-linux-gnu-readelf

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone SUSFS
        run: |
          git clone --depth=1 --branch gki-android12-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu

      - name: Setup KernelSU
        run: |
          if [ "${{ matrix.ksu }}" = "submodule" ]; then
            git config --global --add safe.directory '*'
            git submodule update --init KernelSU
            [ -f KernelSU/.git/shallow ] && git -C KernelSU fetch --unshallow || true
            echo "KernelSU commits: $(git -C KernelSU rev-list --count HEAD)"
            KSU_DIR="KernelSU"
            SYMLINK_TARGET="../KernelSU/kernel"
          else
            git clone --branch "$KSU_TAG" https://github.com/tiann/KernelSU ../KernelSU
            echo "KernelSU commits: $(git -C ../KernelSU rev-list --count HEAD)"
            KSU_DIR="../KernelSU"
            SYMLINK_TARGET="../../KernelSU/kernel"
          fi

          cd "$KSU_DIR"
          patch -p1 --fuzz=3 \
            < "$GITHUB_WORKSPACE/../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" \
            || true
          sed -i 's/^\s*depends on KPROBES && EXT4_FS//' kernel/Kconfig
          sed -i 's/#if (LINUX_VERSION_CODE >= KERNEL_VERSION(6, 4, 0))/#if 1/g' \
            kernel/selinux/rules.c
          sed -i 's/#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 10, 0)/#if 1/g' \
            kernel/selinux/sepolicy.c

          cd "$GITHUB_WORKSPACE"
          ln -sfn "$SYMLINK_TARGET" drivers/kernelsu
          echo "drivers/kernelsu -> $(readlink drivers/kernelsu)"

      - name: Apply SUSFS patches
        run: |
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          cp ../susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h

      - name: Build kernel
        run: |
          mkdir -p out
          cp defconfig out/.config
          make O=out ARCH=arm64 \
            CC=clang LD=ld.lld \
            HOSTCC=clang HOSTCXX=clang++ \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            olddefconfig

          make O=out ARCH=arm64 \
            CC=clang LD=ld.lld \
            HOSTCC=clang HOSTCXX=clang++ \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            KCFLAGS="-march=armv8.2-a" \
            KBUILD_BUILD_USER=lhuna \
            KBUILD_BUILD_HOST=lhuna \
            -j$(nproc) 2>&1 | tee build.log \
            || {
              echo "===== BUILD FAILED ====="
              grep -E " error:|undefined reference to|: error" build.log | tail -80
              tail -60 build.log
              exit 1
            }

      - name: Package kernel
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/ || true
          cp .github/anykernel.sh AnyKernel3/anykernel.sh
          DATE=$(date +%Y%m%d)
          ZIPNAME="lhuna-pong-${DATE}-${{ matrix.variant }}.zip"
          cd AnyKernel3
          zip -r9 "../${ZIPNAME}" . -x ".git/*" "README.md" "*placeholder"
          cd ..
          ls -lh "${ZIPNAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lhuna-pong-${{ matrix.variant }}
          path: "lhuna-pong-*-${{ matrix.variant }}.zip"
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.variant }}
          path: build.log
