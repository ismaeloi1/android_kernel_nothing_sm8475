        run: |
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          which clang && clang --version || { echo "ERROR: clang missing from PATH=$PATH"; exit 1; }
          mkdir -p out
          cp defconfig out/.config
          make O=out ARCH=arm64 \
            CC=clang LD=ld.lld \
            HOSTCC=clang HOSTCXX=clang++ \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            olddefconfig

          make O=out ARCH=arm64 \
            CC=clang LD=ld.lld \
            HOSTCC=clang HOSTCXX=clang++ \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            KCFLAGS="-march=armv8.2-a" \
            KBUILD_BUILD_USER=lhuna \
            KBUILD_BUILD_HOST=lhuna \
            KBUILD_BUILD_TIMESTAMP="Thu Jan  1 00:00:00 UTC 2026" \
            -j$(nproc) 2>&1 | tee build.log \
            || {
              echo "===== BUILD FAILED ====="
              grep -E " error:|undefined reference to|: error" build.log | tail -100
              echo "--- Last 80 lines ---"
              tail -80 build.log
              exit 1
            }

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/ || true
          cp .github/anykernel.sh AnyKernel3/anykernel.sh
          DATE=$(date +%Y%m%d)
          cd AnyKernel3
          zip -r9 "../lhuna-kernel-pong-${DATE}-stable-aur.zip" . \
            -x ".git/*" "README.md" "*placeholder"
          cd ..
          ls -lh "lhuna-kernel-pong-${DATE}-stable-aur.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
