      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/ || true
          cp .github/anykernel.sh AnyKernel3/anykernel.sh
          DATE=$(date +%Y%m%d)
          cd AnyKernel3
          zip -r9 "../lhuna-kernel-pong-${DATE}-stable-aur.zip" . \
            -x ".git/*" "README.md" "*placeholder"
          cd ..
          ls -lh "lhuna-kernel-pong-${DATE}-stable-aur.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lhuna-kernel-stable-aur
          path: lhuna-kernel-pong-*-stable-aur.zip
          if-no-files-found: error

      - name: Upload build log on failure
