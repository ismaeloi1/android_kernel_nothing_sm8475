# ─────────────────────────────────────────────────────────────────────────────
# 3 · stable · llvm-git via Chaotic-AUR (pre-built, dev, no makepkg needed)
# ─────────────────────────────────────────────────────────────────────────────
  build-stable-aur:
    name: "stable · llvm-git (Chaotic-AUR)"
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - name: Init pacman, add Chaotic-AUR, install llvm-git
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm

          # Install non-LLVM build deps first
          pacman -S --noconfirm --needed \
            git bc dtc elfutils flex bison openssl \
            zip wget curl python perl lzop lz4 pahole

          # Add Chaotic-AUR (pre-built AUR binaries, updated hourly)
          pacman-key --recv-key 3056513887B78AEB \
            --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 3056513887B78AEB
          pacman -U --noconfirm \
            'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst' \
            'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst'
          printf '\n[chaotic-aur]\nInclude = /etc/pacman.d/chaotic-mirrorlist\n' \
            >> /etc/pacman.conf
          pacman -Sy --noconfirm

          # Install llvm-git stack from Chaotic-AUR (no makepkg, no compilation)
          pacman -S --noconfirm --needed \
            llvm-git llvm-libs-git clang-git lld-git

          clang --version && ld.lld --version && llvm-ar --version | head -1

          # LLVM wrappers for aarch64-linux-gnu- prefix
